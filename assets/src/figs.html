<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F3EEE4; --card:#FFFCF5; --ink:#151515; --soft:#5E594F; --mute:#A39C8E;
  --yellow:#FFD23F; --red:#EF4A32; --blue:#2D50E6; --blue-soft:#DCE3FF; --line:#D9D1C1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Archivo","Noto Sans SC",sans-serif;color:var(--ink)}
.fig{width:1200px;background:var(--paper);padding:56px 64px 52px;position:relative;margin:0 0 40px}
.tagrow{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tag{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:6px 10px 5px}
.tagrow .rule{flex:1;height:3px;background:var(--ink)}
.tagrow .kicker{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
h2{font-weight:900;font-stretch:72%;font-size:66px;line-height:.98;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:34px;max-width:1000px}
:lang(zh) h2{text-transform:none;font-stretch:100%;font-size:56px;line-height:1.18;letter-spacing:.01em}
.hl{background:linear-gradient(transparent 52%,var(--yellow) 52%,var(--yellow) 92%,transparent 92%);padding:0 .08em;margin:0 -.04em}
.cap{font-size:20px;line-height:1.45;color:var(--soft);max-width:900px;margin-top:26px}
.cap b{color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:14px;border-top:2px solid var(--ink);font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
svg text{font-family:"Archivo","Noto Sans SC",sans-serif}
.mono{font-family:"JetBrains Mono",monospace}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.panel{background:var(--card);border:3px solid var(--ink);padding:22px 22px 18px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.panel .pt{font-weight:900;font-stretch:75%;font-size:34px;text-transform:uppercase;letter-spacing:.01em}
.panel .pill{white-space:nowrap;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;letter-spacing:.1em;padding:5px 9px;text-transform:uppercase}
.panel.bad .pill{background:var(--red);color:#fff}
.panel.good .pill{background:var(--blue);color:#fff}
.panel .ps{font-size:19px;color:var(--soft);margin-bottom:8px}
.panel .ps b{color:var(--ink)}
.panel .pc{font-size:19px;line-height:1.4;border-top:2px dashed var(--line);padding-top:12px;margin-top:4px}

/* flow */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:6px}
.step h3{font-weight:900;font-stretch:78%;font-size:27px;text-transform:uppercase;line-height:1.02;margin-bottom:8px;min-height:56px}
:lang(zh) .step h3{font-stretch:100%;font-size:28px;line-height:1.2;min-height:0;margin-bottom:10px}
.step .en{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.step p{font-size:16.5px;line-height:1.42;color:var(--soft)}

/* hero */
.hero{display:grid;grid-template-columns:600px 1fr;gap:20px;align-items:center;padding-top:60px;padding-bottom:56px}
.hero .eyebrow{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.hero .eyebrow span{background:var(--ink);color:var(--paper);padding:5px 9px 4px}
.hero .word{font-weight:900;font-stretch:66%;font-size:168px;line-height:.86;letter-spacing:-.02em;text-transform:uppercase}
.hero .sub{font-weight:800;font-stretch:80%;font-size:44px;line-height:1.04;text-transform:uppercase;margin-top:22px}
:lang(zh) .hero .sub{font-stretch:100%;font-size:40px;line-height:1.25;text-transform:none}
.hero .lede{font-size:21px;line-height:1.45;color:var(--soft);margin-top:20px;max-width:540px}
</style>
</head>

const C = {ink:'#151515',paper:'#F3EEE4',card:'#FFFCF5',soft:'#5E594F',mute:'#A39C8E',yellow:'#FFD23F',red:'#EF4A32',blue:'#2D50E6',bsoft:'#DCE3FF',line:'#D9D1C1'};

// ---------- drawing helpers ----------
function person(cx, topY, s=1, fill=C.ink){
  const r=14*s, w=26*s, h=34*s, by=topY+2*r+4*s;
  return `<circle cx="${cx}" cy="${topY+r}" r="${r}" fill="${fill}"/>
  <path d="M${cx-w} ${by+h} C${cx-w} ${by+6*s} ${cx-w*0.55} ${by} ${cx} ${by} C${cx+w*0.55} ${by} ${cx+w} ${by+6*s} ${cx+w} ${by+h} Z" fill="${fill}"/>`;
}
function term(x,y,w=84,h=58,opt={}){
  const stroke=opt.stroke||C.ink, fill=opt.fill||C.card, bar=opt.bar||C.ink;
  const k=Math.min(1,h/58), pad=10*k, bh=14*k, sw=3*Math.max(.75,k);
  const lines=h<40?'':[0.62,0.42,0.52].map((f,i)=>`<rect x="${x+pad}" y="${y+h*(0.38+i*0.17)}" width="${(w-2*pad)*f}" height="${4*k}" rx="2" fill="${opt.lineFill||C.mute}"/>`).join('');
  const dots=h<40?`<rect x="${x+w*0.2}" y="${y+h*0.62}" width="${w*0.6}" height="${3}" rx="1.5" fill="${C.mute}"/>`:'';
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${7*k}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
  <path d="M${x} ${y+bh} H${x+w}" stroke="${stroke}" stroke-width="${sw}"/>
  ${[0,1,2].map(i=>`<circle cx="${x+pad+i*8*k}" cy="${y+bh/2+.5}" r="${2.6*k}" fill="${bar}"/>`).join('')}${dots}
  ${lines}</g>`;
}
function badge(cx,cy,r=13,fill=C.red,txt='!'){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${C.ink}" stroke-width="2.5"/><text x="${cx}" y="${cy+r*0.42}" text-anchor="middle" font-weight="900" font-size="${r*1.25}" fill="#fff">${txt}</text>`;
}
function chief(cx,cy,r,sub=true){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.blue}" stroke="${C.ink}" stroke-width="3.5"/>
  <text x="${cx}" y="${cy+(sub?r*0.02:r*0.17)}" text-anchor="middle" font-weight="900" font-stretch="75%" font-size="${r*0.46}" fill="#fff" letter-spacing="1">${T.chief}</text>
  ${sub?`<text x="${cx}" y="${cy+r*0.36}" text-anchor="middle" class="mono" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="${r*0.2}" fill="#fff" letter-spacing="2">${T.ofstaff}</text>`:''}
  <g transform="translate(${cx+r*0.7},${cy-r*0.72})">${star(0,0,r*0.26)}</g>`;
}
function star(cx,cy,r){
  let p=''; for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2, rr=i%2?r*0.45:r; p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)}
  return `<path d="${p}Z" fill="${C.yellow}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
}
function arrowHead(x,y,ang,size=12,fill=C.ink){
  const a=ang*Math.PI/180, p1=[x-size*Math.cos(a)+size*0.6*Math.sin(a), y-size*Math.sin(a)-size*0.6*Math.cos(a)], p2=[x-size*Math.cos(a)-size*0.6*Math.sin(a), y-size*Math.sin(a)+size*0.6*Math.cos(a)];
  return `<path d="M${x} ${y} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z" fill="${fill}"/>`;
}
function doc(x,y,w,h,fill=C.yellow){
  const f=16;
  return `<path d="M${x} ${y} H${x+w-f} L${x+w} ${y+f} V${y+h} H${x} Z" fill="${fill}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M${x+w-f} ${y} V${y+f} H${x+w}" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>`;
}
const foot = n => `<div class="foot"><span>${T.foot}</span><span>${n}</span></div>`;

// ---------- HERO ----------
function hero(){
  const W=470,H=420;
  const termsX=330, ty=[28,118,208,298];
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // fan lines chief -> threads
  ty.forEach(y=>{ s+=`<path d="M210 205 C 270 205, 270 ${y+29}, ${termsX-6} ${y+29}" fill="none" stroke="${C.blue}" stroke-width="4"/>`; s+=arrowHead(termsX-2,y+29,0,11,C.blue); });
  ty.forEach(y=>{ s+=term(termsX,y,110,58); });
  // you <-> chief
  s+=`<path d="M78 300 C 78 240, 100 215, 128 210" fill="none" stroke="${C.ink}" stroke-width="5"/>`+arrowHead(134,209,-8,14);
  s+=chief(190,205,70);
  s+=person(64,300,1.25);
  s+=`<text x="64" y="${300+106}" text-anchor="middle" font-weight="900" font-size="20" letter-spacing="2">${T.you}</text>`;
  s+=`<rect x="104" y="296" width="${lang==='zh'?92:104}" height="28" fill="${C.yellow}" stroke="${C.ink}" stroke-width="2.5"/><text x="${104+(lang==='zh'?46:52)}" y="316" text-anchor="middle" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="14">${T.hero_a}</text>`;
  s+=`</svg>`;
  return `<section class="fig" id="hero"><div class="hero">
    <div>
      <div class="eyebrow"><span>${T.hero_eyebrow}</span></div>
      <div class="word">${T.hero_word}</div>
      <div class="sub">${T.hero_sub}</div>
      <div class="lede">${T.hero_lede}</div>
    </div>
    <div style="display:flex;justify-content:flex-end">${s}</div>
  </div></section>`;
}

// ---------- FIG 1 COMPARE ----------
function cmpSvg(good){
  const W=500,H=420, xs=[8,106,204,302,400], tw=88, th=58, ty=14;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  const youX=250, youTop=318;
  if(!good){
    // red lines straight to you
    xs.forEach((x,i)=>{ const sx=x+tw/2, sy=ty+th; s+=`<path d="M${sx} ${sy} Q ${sx+(youX-sx)*0.15} ${210} ${youX+(sx-youX)*0.12} ${youTop-8}" fill="none" stroke="${C.red}" stroke-width="3.5" stroke-dasharray="9 7"/>`; });
    // main thread box (bypassed)
    s+=`<rect x="170" y="170" width="160" height="62" rx="8" fill="${C.card}" stroke="${C.mute}" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="250" y="197" text-anchor="middle" font-weight="800" font-size="19" fill="${C.soft}">${T.main}</text>
      <text x="250" y="220" text-anchor="middle" font-family="JetBrains Mono, Noto Sans SC" font-weight="500" font-size="13" fill="${C.mute}">${T.relays}</text>`;
    xs.forEach(x=>{ s+=term(x,ty,tw,th); s+=badge(x+tw-4,ty+2); });
    // speech bubbles
    [[96,150],[404,150],[250,120]].forEach(([bx,by])=>{ s+=`<g><rect x="${bx-17}" y="${by-15}" width="34" height="28" rx="6" fill="${C.red}" stroke="${C.ink}" stroke-width="2.5"/><path d="M${bx-5} ${by+12} L${bx} ${by+20} L${bx+4} ${by+12}" fill="${C.red}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/><rect x="${bx-6}" y="${by+9}" width="12" height="5" fill="${C.red}"/><text x="${bx}" y="${by+7}" text-anchor="middle" font-weight="900" font-size="20" fill="#fff">?</text></g>`; });
    s+=person(youX,youTop,1.15);
    // stress marks
    s+=`<path d="M${youX-34} ${youTop+4} l-10 -10 M${youX-38} ${youTop+20} l-14 -2 M${youX+34} ${youTop+4} l10 -10 M${youX+38} ${youTop+20} l14 -2" stroke="${C.red}" stroke-width="4" stroke-linecap="round"/>`;
  } else {
    xs.forEach((x,i)=>{ const sx=x+tw/2, sy=ty+th; s+=`<path d="M${sx} ${sy} Q ${sx} ${150} ${250+(sx-250)*0.25} ${168}" fill="none" stroke="${C.blue}" stroke-width="3.5"/>`; });
    xs.forEach(x=>{ s+=term(x,ty,tw,th); });
    s+=chief(250,212,56);
    // two-way thick line chief <-> you
    s+=`<path d="M250 274 V ${youTop-10}" stroke="${C.ink}" stroke-width="6"/>`+arrowHead(250,youTop-6,90,14)+arrowHead(250,270,-90,14);
    // ask card
    s+=doc(300,262,150,46,C.yellow);
    s+=`<text x="${lang==='zh'?370:368}" y="291" text-anchor="middle" font-weight="800" font-size="${lang==='zh'?16:17}">${T.ask1}</text>`;
    s+=`<path d="M298 286 C 280 290, 272 300, 268 318" fill="none" stroke="${C.ink}" stroke-width="3"/>`+arrowHead(267,322,100,10);
    // thinks label
    s+=`<rect x="${lang==='zh'?28:18}" y="250" width="${lang==='zh'?150:164}" height="30" fill="${C.bsoft}" stroke="${C.ink}" stroke-width="2.5"/><text x="${lang==='zh'?103:100}" y="271" text-anchor="middle" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="14">${T.thinks}</text>`;
    s+=person(youX,youTop,1.15);
    // calm halo
    s+=`<circle cx="${youX}" cy="${youTop+16}" r="34" fill="none" stroke="${C.yellow}" stroke-width="5" opacity="0"/>`;
  }
  s+=`<text x="${youX}" y="${youTop+98}" text-anchor="middle" font-weight="900" font-size="19" letter-spacing="2">${T.you}</text>`;
  s+=`</svg>`;
  return s;
}
function compare(){
  return `<section class="fig" id="compare">
  <div class="tagrow"><span class="tag">${T.c_tag}</span><span class="kicker">${T.c_kick}</span><span class="rule"></span></div>
  <h2>${T.c_h}</h2>
  <div class="cmp">
    <div class="panel bad"><div class="ph"><span class="pt">${T.c_l_t}</span><span class="pill">${T.c_l_p}</span></div><div class="ps">${T.c_l_s}</div>${cmpSvg(false)}<div class="pc">${T.c_l_c}</div></div>
    <div class="panel good"><div class="ph"><span class="pt">${T.c_r_t}</span><span class="pill">${T.c_r_p}</span></div><div class="ps">${T.c_r_s}</div>${cmpSvg(true)}<div class="pc">${T.c_r_c}</div></div>
  </div>
  ${foot('01 / 04')}
  </section>`;
}

// ---------- FIG 2 TRIAGE ----------
function triage(){
  const W=1072,H=446;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // escalation card
  const cx=0, cy=20, cw=330, ch=380;
  s+=`<rect x="${cx+8}" y="${cy+8}" width="${cw}" height="${ch}" fill="${C.ink}"/>`;
  s+=`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="${C.card}" stroke="${C.ink}" stroke-width="3"/>`;
  s+=`<rect x="${cx}" y="${cy}" width="${cw}" height="52" fill="${C.ink}"/>`;
  s+=`<text x="${cx+18}" y="${cy+33}" font-family="JetBrains Mono" font-weight="700" font-size="17" fill="${C.yellow}" letter-spacing="2">${T.esc}</text>`;
  s+=`<text x="${cx+cw-16}" y="${cy+33}" text-anchor="end" font-family="JetBrains Mono, Noto Sans SC" font-weight="500" font-size="13" fill="${C.paper}">${T.escfrom}</text>`;
  [[T.e1,T.e1x],[T.e2,T.e2x],[T.e3,T.e3x],[T.e4,T.e4x]].forEach(([a,b],i)=>{
    const y=cy+66+i*78;
    if(i) s+=`<path d="M${cx+16} ${y-6} H${cx+cw-16}" stroke="${C.line}" stroke-width="2" stroke-dasharray="5 5"/>`;
    s+=`<circle cx="${cx+34}" cy="${y+26}" r="17" fill="${i===2?C.yellow:C.paper}" stroke="${C.ink}" stroke-width="2.5"/><text x="${cx+34}" y="${y+33}" text-anchor="middle" font-weight="900" font-size="19">${i+1}</text>`;
    s+=`<text x="${cx+64}" y="${y+22}" font-weight="900" font-size="21" font-stretch="85%">${a}</text>`;
    s+=`<text x="${cx+64}" y="${y+46}" font-size="15.5" fill="${C.soft}">${b}</text>`;
  });
  // arrow to chief
  const chx=470, chy=210, r=72;
  s+=`<path d="M${cw+14} ${chy} H ${chx-r-14}" stroke="${C.ink}" stroke-width="6"/>`+arrowHead(chx-r-6,chy,0,16);
  // flows
  const ox=chx+r-6, dx=690;
  const dest=[[96,40,C.blue],[250,14,C.yellow],[356,14,C.yellow]];
  dest.forEach(([y,w,col])=>{
    s+=`<path d="M${ox} ${chy+(y-210)*0.12} C ${ox+90} ${chy+(y-210)*0.12}, ${dx-110} ${y}, ${dx-14} ${y}" fill="none" stroke="${C.ink}" stroke-width="${w+6}"/>`;
    s+=`<path d="M${ox} ${chy+(y-210)*0.12} C ${ox+90} ${chy+(y-210)*0.12}, ${dx-110} ${y}, ${dx-14} ${y}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    s+=arrowHead(dx+6,y,0,w>20?30:18);
  });
  s+=chief(chx,chy,r);
  // labels
  const lx=dx+22;
  s+=`<text x="${lx}" y="${lang==='zh'?110:114}" font-weight="900" font-stretch="72%" font-size="${lang==='zh'?40:50}">${T.ans}</text>`;
  const mw = lang==='zh'?136:152;
  s+=`<rect x="${W-mw}" y="${82}" width="${mw}" height="28" fill="${C.yellow}" stroke="${C.ink}" stroke-width="2.5"/><text x="${W-mw/2}" y="${102}" text-anchor="middle" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="13" letter-spacing="1">${T.most}</text>`;
  s+=`<text x="${lx}" y="144" font-size="17" fill="${C.soft}">${T.ans1}</text><text x="${lx}" y="167" font-size="17" fill="${C.soft}">${T.ans2}</text>`;
  [[250,T.ask,T.ask1x,T.ask2x],[356,T.show,T.show1,T.show2]].forEach(([y,w,a,b])=>{
    s+=`<text x="${lx}" y="${y+12}" font-weight="900" font-stretch="72%" font-size="${lang==='zh'?30:36}">${w}</text>`;
    s+=`<text x="${lx}" y="${y+38}" font-size="16" fill="${C.soft}">${a}</text><text x="${lx}" y="${y+59}" font-size="16" fill="${C.soft}">${b}</text>`;
  });
  s+=`</svg>`;
  return `<section class="fig" id="triage">
  <div class="tagrow"><span class="tag">${T.t_tag}</span><span class="kicker">${T.t_kick}</span><span class="rule"></span></div>
  <h2>${T.t_h}</h2>${s}<div class="cap">${T.t_cap}</div>${foot('02 / 04')}</section>`;
}

// ---------- FIG 3 FLOW ----------
function flow(){
  const W=1072,H=230, n=6, gap=18, colW=(W-gap*5)/6;
  const cx=i=>colW/2+i*(colW+gap);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
  const bands=[[0,1,C.yellow,C.ink,T.band1],[2,4,C.blue,'#fff',T.band2],[5,5,C.ink,C.paper,T.band3]];
  bands.forEach(([a,b,bg,fg,label])=>{
    const x=a*(colW+gap), w=(b-a+1)*colW+(b-a)*gap;
    s+=`<rect x="${x}" y="0" width="${w}" height="38" fill="${bg}" stroke="${C.ink}" stroke-width="3"/>`;
    s+=`<text x="${x+w/2}" y="25.5" text-anchor="middle" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="15" letter-spacing="3" fill="${fg}">${label}</text>`;
  });
  const ly=160;
  s+=`<path d="M${cx(0)} ${ly} H ${W-10}" stroke="${C.ink}" stroke-width="6"/>`+arrowHead(W-2,ly,0,18);
  // threads above Run
  [cx(3)-58,cx(3)-17,cx(3)+24].forEach((x,i)=>{ s+=term(x,64,34,24,{}); });
  [cx(3)-41,cx(3),cx(3)+41].forEach(x=>{ s+=`<path d="M${x} 90 L ${cx(3)+(x-cx(3))*0.3} 116" stroke="${C.blue}" stroke-width="3"/>`; });
  for(let i=0;i<n;i++){
    const fill = i===3?C.blue:(i===5?C.ink:C.card), fg=(i===3||i===5)?'#fff':C.ink;
    s+=`<circle cx="${cx(i)}" cy="${ly}" r="42" fill="${fill}" stroke="${C.ink}" stroke-width="4.5"/>`;
    s+=`<text x="${cx(i)}" y="${ly+15}" text-anchor="middle" font-weight="900" font-stretch="70%" font-size="44" fill="${fg}">${String(i+1).padStart(2,'0')}</text>`;
  }
  // chief marker on Run
  s+=`<g transform="translate(${cx(3)+32},${ly-34})">${star(0,0,13)}</g>`;
  s+=`</svg>`;
  const steps=T.s.map(([h,p,e])=>`<div class="step">${e?`<div class="en">${e}</div>`:''}<h3>${h}</h3><p>${p}</p></div>`).join('');
  return `<section class="fig" id="flow">
  <div class="tagrow"><span class="tag">${T.f_tag}</span><span class="kicker">${T.f_kick}</span><span class="rule"></span></div>
  <h2>${T.f_h}</h2>${s}<div class="steps" style="margin-top:22px">${steps}</div>${foot('03 / 04')}</section>`;
}

// ---------- FIG 4 CHAIN ----------
function chain(){
  const W=1072,H=560;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // ongoing project
  s+=`<text x="0" y="22" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="15" letter-spacing="3" fill="${C.soft}">${T.ongoing}</text>`;
  s+=`<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="${C.yellow}"/><stop offset=".55" stop-color="#F7934A"/><stop offset="1" stop-color="${C.red}"/></linearGradient></defs>`;
  s+=`<rect x="0" y="38" width="${W}" height="56" fill="${C.card}" stroke="${C.ink}" stroke-width="3"/>`;
  s+=`<path d="M1.5 92.5 L ${W-1.5} 39.5 L ${W-1.5} 92.5 Z" fill="url(#g1)"/>`;
  s+=`<rect x="0" y="38" width="${W}" height="56" fill="none" stroke="${C.ink}" stroke-width="3"/>`;
  for(let i=1;i<14;i++) s+=`<path d="M${i*W/14} 38 V 46" stroke="${C.ink}" stroke-width="2"/>`;
  s+=`<text x="${W-16}" y="124" text-anchor="end" font-size="18" font-weight="700" fill="${C.red}">${T.ongoing_note}</text>`;

  // campaigns row
  const ry=170;
  s+=`<text x="0" y="${ry}" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="15" letter-spacing="3" fill="${C.soft}">${T.camps}</text>`;
  const bw=214, bh=168, by=ry+20, hx=132; // handoff width
  const xs=[0, bw+hx, 2*(bw+hx)];
  xs.forEach((x,i)=>{
    s+=`<rect x="${x+7}" y="${by+7}" width="${bw}" height="${bh}" fill="${C.ink}"/>`;
    s+=`<rect x="${x}" y="${by}" width="${bw}" height="${bh}" fill="${C.card}" stroke="${C.ink}" stroke-width="3"/>`;
    s+=`<rect x="${x}" y="${by}" width="${bw}" height="38" fill="${C.ink}"/>`;
    s+=`<text x="${x+14}" y="${by+26}" font-family="JetBrains Mono" font-weight="700" font-size="15" letter-spacing="2" fill="${C.paper}">${T.camp} ${i+1}</text>`;
    s+=`<g transform="translate(${x+bw-24},${by+19})">${star(0,0,11)}</g>`;
    s+=`<text x="${x+14}" y="${by+70}" font-weight="900" font-stretch="80%" font-size="25">${T.obj[i]}</text>`;
    // mini threads
    [0,1,2].forEach(k=>{ s+=term(x+14+k*42,by+86,34,24); });
    // context meter
    s+=`<text x="${x+14}" y="${by+138}" font-family="JetBrains Mono, Noto Sans SC" font-weight="500" font-size="12" fill="${C.soft}" letter-spacing="1">${T.ctx}</text>`;
    s+=`<rect x="${x+14}" y="${by+146}" width="${bw-28}" height="10" fill="${C.paper}" stroke="${C.ink}" stroke-width="2"/>`;
    s+=`<rect x="${x+15}" y="${by+147}" width="${(bw-30)*0.28}" height="8" fill="${C.blue}"/>`;
    // promote arrow down
    s+=`<path d="M${x+bw/2} ${by+bh+12} V ${by+bh+66}" stroke="${C.ink}" stroke-width="4" stroke-dasharray="7 6"/>`+arrowHead(x+bw/2,by+bh+74,90,13);
    if(i===0) s+=`<text x="${x+bw/2+12}" y="${by+bh+46}" font-family="JetBrains Mono, Noto Sans SC" font-weight="700" font-size="13" fill="${C.soft}">${T.promote}</text>`;
  });
  // handoffs
  [0,1].forEach(i=>{
    const x=xs[i]+bw+14, mid=by+bh/2;
    s+=`<path d="M${xs[i]+bw+8} ${mid+24} H ${xs[i+1]-10}" stroke="${C.ink}" stroke-width="5"/>`+arrowHead(xs[i+1]-4,mid+24,0,14);
    s+=doc(x+8,mid-58,hx-44,62,C.yellow);
    s+=`<text x="${x+8+(hx-44)/2-4}" y="${mid-30}" text-anchor="middle" font-weight="900" font-size="${lang==='zh'?17:15}" font-stretch="85%">${T.handoff}</text>`;
    s+=`<rect x="${x+16}" y="${mid-20}" width="${hx-64}" height="3.5" fill="${C.ink}" opacity=".5"/><rect x="${x+16}" y="${mid-12}" width="${(hx-64)*0.7}" height="3.5" fill="${C.ink}" opacity=".5"/>`;
  });
  // handoff legend under first handoff
  s+=`<text x="${xs[0]+bw+hx/2}" y="${by+bh/2+56}" text-anchor="middle" font-size="13.5" fill="${C.soft}">${T.handoff_sub}</text><text x="${xs[0]+bw+hx/2}" y="${by+bh/2+74}" text-anchor="middle" font-size="13.5" fill="${C.soft}">${T.handoff_sub2}</text>`;
  // forever
  const fx=xs[2]+bw+20;
  const ix=W-74;
  s+=`<path d="M${xs[2]+bw+8} ${by+bh/2+24} H ${ix-56}" stroke="${C.ink}" stroke-width="5" stroke-dasharray="10 8"/>`;
  s+=`<text x="${ix}" y="${by+bh/2+44}" text-anchor="middle" font-weight="900" font-size="88" fill="${C.ink}">∞</text>`;
  s+=`<text x="${ix}" y="${by+bh/2+76}" text-anchor="middle" font-size="14" font-weight="700" fill="${C.soft}">${T.forever}</text>`;
  // standing context band
  const sy=by+bh+84;
  s+=`<path d="M0 ${sy+22} L ${W} ${sy} L ${W} ${sy+84} L 0 ${sy+62} Z" fill="${C.ink}"/>`;
  s+=`<text x="22" y="${sy+48}" font-family="JetBrains Mono" font-weight="700" font-size="16" letter-spacing="3" fill="${C.yellow}">${T.standing}</text>`;
  s+=`<text x="268" y="${sy+48}" font-size="16" fill="${C.paper}">${T.standing_sub}</text>`;
  s+=`</svg>`;
  return `<section class="fig" id="chain">
  <div class="tagrow"><span class="tag">${T.k_tag}</span><span class="kicker">${T.k_kick}</span><span class="rule"></span></div>
  <h2>${T.k_h}</h2>${s}<div class="cap">${T.k_cap}</div>${foot('04 / 04')}</section>`;
}

document.getElementById('root').innerHTML = hero()+compare()+triage()+flow()+chain();
</script>
</body>
